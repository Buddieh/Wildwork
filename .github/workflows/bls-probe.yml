name: BLS probe (temporary)
on:
  push:
    paths: [.github/workflows/bls-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          A='Wildwork job-data builder (https://github.com/Buddieh/Wildwork)'
          echo "== localtrends"; curl -sL -A "$A" 'https://www.onetonline.org/link/localtrends/15-1252.00' | grep -n -A12 -i 'Employment.*(2025)' | head -60
          echo "== localtrends shared code"; curl -sL -A "$A" 'https://www.onetonline.org/link/localtrends/15-1299.08' | sed 's/<[^>]*>/ /g' | grep -E '[0-9]{2}' | grep -ivE 'script|function|var ' | head -20
          echo "== summary wages"; curl -sL -A "$A" 'https://www.onetonline.org/link/summary/23-1011.00' | grep -n -B2 -A10 -i 'Median wages' | head -60
          echo "== summary wage high"; curl -sL -A "$A" 'https://www.onetonline.org/link/summary/29-1211.00' | sed 's/<[^>]*>/ /g' | grep -A3 -i 'median wages' | head -8
