name: Refresh job data

# Rebuilds data/jobs.json from the latest O*NET release. O*NET updates quarterly; checking monthly keeps
# new titles and Bright Outlook flags current without manual work.
on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:
  push:
    paths:
      - data/build_jobs.py
      - .github/workflows/job-data.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 data/build_jobs.py
      - name: Commit if changed
        run: |
          git add data/jobs.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh job data from O*NET"
          git push
